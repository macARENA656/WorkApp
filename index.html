<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет времени — Система мониторинга</title>
    <style>
        :root {
            --bg-color: #1a1d23;
            --card-bg: #252932;
            --accent-blue: #3498db;
            --accent-red: #e74c3c;
            --text-main: #e0e0e0;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            width: 90%;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .badge {
            background: var(--accent-blue);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            vertical-align: middle;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-top: 3px solid var(--accent-blue);
        }

        .card.alt {
            border-top-color: var(--accent-red);
        }

        h3 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 1.2rem;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .screenshot-box {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 15px;
            border: 1px solid #3e4451;
        }

        .screenshot-box img {
            width: 100%;
            display: block;
            filter: grayscale(20%);
            transition: filter 0.3s;
        }

        .screenshot-box img:hover {
            filter: grayscale(0%);
        }

        .download-area {
            text-align: center;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            background: var(--accent-blue);
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 6px;
            font-weight: 600;
            transition: transform 0.2s, background 0.2s;
        }

            background: #2980b9
